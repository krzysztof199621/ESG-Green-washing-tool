onstruction","Core and Shell"],"rating_system_weight":[0,1],"required":["Required"],"short_id":["SSp1"],"sort_id":[1],"title":["Minimize Site Disturbance"],"type":["credit_definition"],"updated_date":[1773851122],"version":["v5"]},"sort":[-9223372036854776000,13,"Required",1,"Minimize Site Disturbance"]},{"_index":"elasticsearch_index_live_usgbc_credits_dev","_id":"entity:node/16018900:en","_score":null,"_source":{"_language":"en","url":["/credits/new-construction-core-and-shell/v5/ssc1"],"all_reference_resources":[16682895],"category":["Sustainable sites"],"category_weight":[13],"credit_code":["SSc1"],"credit_options":[16018966],"credit_type":["1"],"image":["/sites/default/files/2025-03/SS%20icon%20%28png%29_0.png"],"node_id":[16018900],"points_from":["0"],"points_to":["2"],"published_date":[1742222797],"published_status":[1],"rating_system":["New Construction","Core and Shell"],"rating_system_weight":[0,1],"required":["Not Required"],"short_id":["SSc1"],"sort_id":[2],"title":["Biodiverse Habitat"],"type":["credit_definition"],"updated_date":[1772834539],"version":["v5"]},"sort":[-9223372036854776000,13,"Not Required",2,"Biodiverse Habitat"]}],"total":126,"time":2},"Category":{"hits":[],"total":126,"time":0},"Version":{"hits":[{"_index":"elasticsearch_index_live_usgbc_credits_dev","_id":"entity:node/2613097:und","_score":null,"_ignored":["step_by_step_guidance.raw","further_explanation.raw"],"_source":{"_language":"und","url":["/credits/new-construction-core-and-shell-schools-new-construction-retail-new-construction-data-39"],"all_reference_resources":[4378785,7907716],"behind_the_intent":["An integrative process is a comprehensive approach to building systems and equipment. Project team members look for synergies among systems and components, the mutual advantages that can help achieve high levels of building performance, human comfort, and environmental benefits. The process should involve rigorous questioning and coordination and challenge typical project assumptions. Team members collaborate to enhance the efficiency and effectiveness of every system. \n\nThe Integrative Process credit goes beyond checklists and encourages integration during early design stages, when clarifying the owner’s aspirations, performance goals, and project needs will be most effective in improving performance. An integrative process comprises three phases. The first—discovery—is also the most important and can be seen as an expansion of what is conventionally called predesign. Actions taken during discovery are essential to achieving a project’s environmental goals cost-effectively. The second phase, design and construction, begins with what is conventionally called schematic design. Unlike its conventional counterpart, however, in the integrative process, design will incorporate all of the collective understandings of system interactions that were found during discovery. The third phase is the period of occupancy, operations, and performance feedback. Here, the integrative process measures performance and sets up feedback mechanisms. Feedback is critical to determining success in achieving performance targets, informing building operations, and taking corrective action when targets are missed.\n\nA fully integrative process accounts for the interactions among all building and site systems; this credit serves as an introduction to the comprehensive process, rewarding project teams that apply an integrative approach to energy and water systems. By understanding building system interrelationships, project teams will ideally discover unique opportunities for innovative design, increased building performance, and greater environmental benefits that will earn more LEED points. By identifying synergies between systems, teams will save time and money in both the short and the long term while optimizing resource use. Finally, the integrative process can avoid the delays and costs resulting from design changes during the construction documents phase and can reduce change orders during construction.\n\nThrough the integrative process, project teams can more effectively use LEED as a comprehensive tool for identifying interrelated issues and developing synergistic strategies. When applied properly, the integrative process reveals the degree to which LEED credits are related, rather than individual items on a checklist. \n"],"category":["Integrative process credits"],"category_weight":[10],"changes_from_previous_ver":["This is a new credit."],"credit_doc_guidance":["[view:embed_resource==4376183]"],"credit_exemp_performance":["Not available."],"credit_options":[4387795,2613101,2613103,10919673],"credit_side_col_embed":["\u003ch5\u003eGetting Started with Integrative Process\u003c/h5\u003e\r\n[view:embed_resource==4370005]","\u003ch5\u003eWhy Integrative Process?\u003c/h5\u003e\r\n[view:embed_resource==4370026]"],"credit_type":["1"],"field_related_courses":[12848895,12846493],"further_explanation":["\u003cdiv id=\"examples\" class=\"section custom_section\"\u003e\n\u003ch1\u003eExamples\u003c/h1\u003e\n\u003ch5\u003eExample 1. Light level analysis\u003csup\u003e1\u003c/sup\u003e\u003c/h5\u003e\n\nDuring the early stages of a Schools project, the team was able to reduce the number of lighting fixtures in classrooms by 25% compared with standard practice by selecting a paint color whose light reflectance value was 75%, instead of 64% for the initial proposed paint selection, while maintaining adequate illuminance (roughly 50 footcandles) on work surfaces.\n\nThe reduction in the number of light fixtures has multiple benefits, beyond the initial savings in fixture purchases and installation: the cost of electrical energy for lighting falls by 25% over the life of the building, and since lighting produces heat, the costs for cooling (roughly 1 watt of energy for every 3 watts of lighting) are reduced. \n\n\u003ch5\u003eExample 2. Determining load reduction strategies\u003c/h5\u003e\n\nDetermining effective load reduction strategies is the first step in creating an energy-efficient building. Early focus on load reduction is important because once the space programming is completed and the building is constructed, changing certain components that affect loads becomes difficult and expensive, especially for a building dominated by external or building envelope loads. \n\nAn example of a dominant external load is a fully glazed western façade in a mixed climate like New York City. This type of façade creates large loads for both cooling and heating, resulting in excessive energy use and oversizing of HVAC systems. Example strategies to decrease envelope loads include increasing insulated opaque wall area (balanced with daylighting strategies), increasing the insulating value of the glazing and window frame system, and summer solar shading. \n\nOn the other end of the spectrum are large buildings with dominant internal loads, like hospitals. Internal loads are often cooling loads, created by a combination of heat-producing lighting, equipment, and occupants. Conditioning of outside air is another big internal load. Load reduction strategies include decreasing lighting power, providing daylighting, reducing plug loads, using economizers for free cooling, and reducing the amount of ventilation air during periods of partial occupancy with CO\u003csub\u003e2\u003c/sub\u003e sensors. \n\nIn both cases, significant energy load reductions can be achieved. The concept model can provide feedback on which combination of strategies is likely to be the most effective and guide the design team in preparation for modeling HVAC systems. This allows HVAC systems to be properly sized and equipment efficiency improved in subsequent models; the team may be able to downsize or even eliminate equipment. The integrated approach can thus save both energy and capital costs of construction. \n\n\u003ch5\u003eExample 3. Worksheet Documentation\u003c/h5\u003e\nDescribe how research and analysis uncovered through discovery influenced the project building program, form, geometry, and/or configuration. \n\n\u003cem\u003eThe architect and mechanical engineer both started with the idea that two 100-ton chillers would be necessary for the AC system but had not thoroughly considered modifications to the building envelope design. Using the energy model to inform decisions about both, they instead specified two 50-ton chillers. The project also had a “future expansion” component that was not adequately defined, so the team experienced difficulty planning for design flexibility. The team paused and specifically addressed adaptability during the goal-setting workshop and then in the OPR, including which materials would be reclaimed or reused during the future expansion phase. Although opinions differed on the best way forward, the team’s interaction added clarity to the process and better defined the expectations for the building’s operations and future phasing.\u003c/em\u003e\n\n\u003cdiv class=\"”footnotes”\"\u003e \n\u003cp\u003e\u003csup\u003e1\u003c/sup\u003eAdapted from 7group and Bill G. Reed, \u003cem\u003eThe Integrative Design Guide to Green Building: Redefining the Practice of Sustainability\u003c/em\u003e (John Wiley \u0026amp; Sons, Inc., 2009).\u003c/p\u003e\n\u003c/div\u003e\n\u003c/div\u003e\n\n\n\u003cdiv id=\"recommended_prelim_data\" class=\"section custom_section\"\u003e\n\u003ch1\u003eRecommended Preliminary Data Collection\u003c/h1\u003e\nTo understand the likely energy load distribution by end use, use a “simple box” energy model to identify initial annual energy consumption percentages of total energy use for each of the following end uses (Figure 1):\n\u003cul\u003e\n\u003cli\u003eSpace heating\u003c/li\u003e\n\u003cli\u003eSpace cooling\u003c/li\u003e\n\u003cli\u003eVentilation\u003c/li\u003e\n\u003cli\u003eDomestic hot water\u003c/li\u003e\n\u003cli\u003eLighting\u003c/li\u003e\n\u003cli\u003eMiscellaneous equipment\u003c/li\u003e\n\u003cli\u003eOther, as applicable\u003c/li\u003e\n\u003c/ul\u003e\nTypical energy consumption by end use for a project depends on building type, occupancy, climate, and other project-specific conditions. \n\nFigure 1. Example energy load distribution graph\n[view:embed_resource==4369759]\n\nLocal climate data include annual and hourly dry-bulb temperature, wet-bulb depression, relative humidity, comfort hours, and average annual and monthly rainfall for the project site.\n\nFor Steps 2 and 3, gather the information outlined for SS Credit Site Assessment, including solar and wind capacity, heating and cooling degree days, seasonal wind velocity and direction, precipitation, microclimate, available energy sources, utility providers, energy and peak load costs, potential financial incentives, and other issues likely to affect energy-related systems.\n\nFor Step 3, consider the location (distance from site), capacity, and type and level of treatment for the sewage system serving the site, including any sewage plant facilities. Include data on average water treatment cost.\n\nFor Step 3, consider the location, capacity, and type of water sources serving the site, such as reservoirs, aquifers, wells, lakes, rivers, nonpotable sources, and municipal supply. Include monthly and annual rainfall data and the average cost of potable (and/or nonpotable) water.\n\u003c/div\u003e\n\n\u003cdiv id=\"recommended_prelim_energy\" class=\"section custom_section\"\u003e\n\u003ch1\u003eRecommended Preliminary Energy Analysis\u003c/h1\u003e\nBefore design of the building form begins, a building massing (“simple box”) energy analysis can be used to evaluate potential energy and load reduction strategies, such as insulation levels and window performance levels. Initial modeling iterations should include the strategies in Step 5. \n\n\u003cstrong\u003eSite conditions.\u003c/strong\u003e Consider options that integrate landscape components and strategies that reduce exterior lighting. \n\u003cstrong\u003eMassing and orientation.\u003c/strong\u003e Consider two fundamental building footprint shapes or two building heights (e.g., one-story versus two stories for the same total gross square footage). Evaluate how rotating the building 90 degrees affects energy loads.\n\u003cstrong\u003eBuilding envelope performance.\u003c/strong\u003e Consider options for the following aspects: \n\u003cul\u003e\n\u003cli\u003eSolar heat gain coefficients, overall U-value of glazing systems, performance criteria for windows in low, medium, and high ranges\u003c/li\u003e\n\u003cli\u003eR-value (insulation) of walls, roofs, and conditioned below-grade structures in low, medium, and high ranges\u003c/li\u003e\n\u003cli\u003eEffect of orientation on energy loads\u003c/li\u003e\n\u003cli\u003eEffect of percentage of exterior glazing (e.g., 30%, 50%, and 70%) on energy loads\u003c/li\u003e\n\u003c/ul\u003e\n\u003cstrong\u003eLighting levels.\u003c/strong\u003e Consider at least two options for reasonable reductions in lighting power density, including one aimed at a significant reduction from ASHRAE standards.\n\u003cstrong\u003eThermal comfort ranges.\u003c/strong\u003e Consider options for expanding the thermal comfort range.\n\u003cstrong\u003ePlug and process load needs.\u003c/strong\u003e Consider at least two options for reasonable reductions in plug load density, including one aimed at a significant reduction from ASHRAE standards. \n\u003cstrong\u003eProgrammatic and operational parameters.\u003c/strong\u003e Consider options aimed at reducing building size, hours of occupancy, and/or number of occupants.\n\nSimple massing sketches of rough configurations can be converted to simple box energy models. In both cases of this example, only a single wing of each sketch was modeled to simplify this early energy modeling, as depicted in Figures 2 and 3.\n\nFigure 2. Simple massing sketches. \u003cem\u003eImage courtesy of The Design Alliance Architects, Pittsburgh, PA © 2008. Phipps Center for Sustainable Landscapes.\u003c/em\u003e\n[view:embed_resource==4369767]\n\nThe purpose of the modeling at this stage is to evaluate coarse-grain building configuration differences; only options that have large consequences need to be modeled (Figure 3).\nFigure 3. Simple model. \u003cem\u003eImage courtesy of 7group.\u003c/em\u003e\n[view:embed_resource==4369768]\n\nUse this early iterative conceptual energy modeling to understand the building’s heating and cooling loads and determine whether the project’s energy use is likely to be dominated by internal or external loads. Small commercial and most residential projects are frequently dominated by external loads; that is, exterior conditions tend to affect the building’s heating and cooling loads more than internal conditions. As a result, the performance of the building’s envelope tends to have a larger effect than internal loads such as lighting. Large commercial buildings tend to be dominated by internal loads: occupants, equipment, and ventilation may be far greater contributors to the overall load than the performance of the building envelope, depending on climatic conditions.\n\n\u003c/div\u003e\n\n\u003cdiv id=\"rating_system_variations\" class=\"section custom_section\"\u003e\n\u003ch1\u003eRating System Variations\u003c/h1\u003e\n\u003ch5\u003eCore and Shell \u003c/h5\u003e\n\nThe energy-related systems analysis should include all system loads and occupants required by EA Prerequisite Minimum Energy Performance for Core and Shell projects. The water-related systems analysis should include all system loads and occupants required by both WE Prerequisite Outdoor Water Use and WE Prerequisite Indoor Water Use for Core and Shell projects. \n\u003c/div\u003e\n\n\u003cdiv id=\"project_type_variations\" class=\"section custom_section\"\u003e\n\u003ch1\u003eProject Type Variations\u003c/h1\u003e\n\u003ch5\u003eMajor Renovations \u003c/h5\u003e\n\nThe energy-related systems analysis and water-related systems analysis should include all of the same systems required for new construction projects, as described above, except for the massing and orientation component.\n\n\u003c/div\u003e\n\u003cdiv id=\"campus\" class=\"section custom_section\"\u003e\n\u003ch1\u003eCampus\u003c/h1\u003e\n\u003ch5\u003eGroup Approach\u003c/h5\u003e\nAll buildings in the group may be documented as one.\n\n\u003ch5\u003eCampus Approach\u003c/h5\u003e\nIneligible. Each LEED project may pursue the credit individually.\n\n\u003c/div\u003e\n\n"],"image":["/sites/default/files/ipc.png"],"innovation_flag":["Not an innovation credit"],"node_id":[2613097],"open_for_comments":[0],"phase":["Design"],"pilot_credit":["0"],"points_from":["1"],"points_to":["1"],"promotion_text":["\u003cdiv class=\"aside-dark\"\u003e\r\n\u003ch5\u003eFree Preview!\u003c/h5\u003e\r\n\u003cp\u003eThis web-based reference guide credit is provided for all users as a free preview. For more information on the web-based guide check out \u003ca href=\"/guide\"\u003eusgbc.org/guide\u003c/a\u003e. \u003ca href=\"/subscription/contact?renew_id=4378230\"\u003ePurchase or renew access\u003c/a\u003e to the full guide.\r\n\u003c/p\u003e\r\n\u003c/div\u003e"],"public_access":[1],"published_date":[1347915185],"published_status":[1],"rating_system":["New Construction","Core and Shell","Schools - New Construction","Retail - New Construction","Data centers - New Construction","Warehouse and distribution centers - New Construction","Hospitality - New Construction","Healthcare"],"rating_system_weight":[0,1,2,3,4,5,6,7],"related_credit_tips":["\u003cstrong\u003e\u003ca href=\"/node/2615193\" target=\"_blank\"\u003eLT Credit Access to Quality Transit\u003c/a\u003e\u003c/strong\u003e. The related credit’s methodology for calculating transit service daily trips can be used to compare the suitability of project site locations for commuters. \n\n\u003cstrong\u003e\u003ca href=\"/node/2613971\" target=\"_blank\"\u003eLT Credit Reduced Parking Footprint\u003c/a\u003e\u003c/strong\u003e. Reducing paved area and enlarging the landscaped area can expand the potential for rainwater infiltration aid the irrigation strategies connected with the preliminary water budget analysis required for this credit. This credit also requires that at least one on-site nonpotable water supply source contribute to at least two water demands; for example, a nonpotable water supply source such as harvested rainwater used for both irrigation and toilet flushing satisfies this requirement. \n\n\u003cstrong\u003e\u003ca href=\"/node/2758172\" target=\"_blank\"\u003eSS Credit Site Assessment\u003c/a\u003e\u003c/strong\u003e. Addressing the related credit together with this credit will offer a more holistic perspective on the design opportunities and challenges. For best results, conduct the site assessment at the same time as the energy and water analyses required by this credit and present findings to the owner in one package. Climate data research and collection are recommended for both credits. \n\n\u003cstrong\u003e\u003ca href=\"/node/2613129\" target=\"_blank\"\u003eSS Credit Open Space\u003c/a\u003e\u003c/strong\u003e. A larger landscaped area can increase graywater infiltration and aid irrigation—issues that relate to the preliminary water budget analysis required for this credit. Integrate vegetated areas (including roofs) to meet the requirements of SS Credit Rainwater Management, SS Credit Heat Island Reduction, WE Prerequisite and Credit Indoor Water Use Reduction, and WE Prerequisite and Credit Outdoor Water Use Reduction as part of a holistic analysis. Attention to the credits’ interconnections allows optimization of the whole. Also take into account site design, building location, orientation, and massing, all of which can affect the preliminary energy-related systems analysis required for this credit—for example, using vegetation to provide solar shading. \n\n\u003cstrong\u003e\u003ca href=\"/node/2764291\" target=\"_blank\"\u003eSS Credit Rainwater Management\u003c/a\u003e\u003c/strong\u003e. The preliminary water budget analysis required for this credit enables project teams to see how associated water issues interrelate. In developing the required water analysis, look for synergies with the related credit, plus SS Credit Open Space, SS Credit Heat Island Reduction, WE Prerequisite and Credit Indoor Water Use Reduction, and WE Prerequisite and Credit Outdoor Water Use Reduction, for achieving both cost and performance improvements.\n\n\u003cstrong\u003e\u003ca href=\"/node/2613950\" target=\"_blank\"\u003eSS Credit Heat Island Reduction\u003c/a\u003e\u003c/strong\u003e. Many heat island reduction strategies alter both the preliminary water budget analysis and the preliminary energy-related systems analysis. For example, vegetated roofs that improve the energy performance of buildings are often paired with rainwater-harvesting systems.\n\n\u003cstrong\u003e\u003ca href=\"/node/2600382\" target=\"_blank\"\u003eSS Credit Light Pollution Reduction\u003c/a\u003e\u003c/strong\u003e. Reducing exterior lighting power density addresses a site conditions aspect of the preliminary energy analysis.\n\n\u003cstrong\u003e\u003ca href=\"/node/2611372\" target=\"_blank\"\u003eWE Prerequisite and Credit Outdoor Water Use Reduction\u003c/a\u003e\u003c/strong\u003e. The landscape water requirement calculation methodology of the related prerequisite and credit must be used for conducting the preliminary water budget analysis.\n\n\u003cstrong\u003e\u003ca href=\"/node/1734960\" target=\"_blank\"\u003eWE Prerequisite and Credit Indoor Water Use Reduction\u003c/a\u003e\u003c/strong\u003e. The building water use and appliance and process use calculation methodologies of the related prerequisite and credit must be used for conducting the preliminary water budget analysis.\n\n\u003cstrong\u003e\u003ca href=\"/node/2611780\" target=\"_blank\"\u003eWE Credit Cooling Tower Makeup Water\u003c/a\u003e\u003c/strong\u003e. For projects with cooling towers or evaporative condensers, the calculation methodologies in the related credit can be used for conducting the preliminary water budget analysis. This credit also requires that at least one on-site nonpotable water supply source contribute to at least two water demands; for example, a nonpotable water supply source such as harvested rainwater used for cooling tower cycling plus one other demand-side use satisfies this requirement. \n\n\u003cstrong\u003e\u003ca href=\"/node/2612328\" target=\"_blank\"\u003eEA Prerequisite Fundamental Commissioning and Verification\u003c/a\u003e\u003c/strong\u003e. The narrative that this credit requires, describing the preliminary energy-related systems analysis and preliminary water budget analysis, must be included in the project’s OPR and BOD, both of which are required by the related prerequisite. The purpose here is to give the commissioning authority an understanding of the process and criteria used to select the designed systems—that is, the “why,” not just the “what.” \n\n\u003cstrong\u003e\u003ca href=\"/node/2613358\" target=\"_blank\"\u003eEA Prerequisite Minimum Energy Performance and EA Credit Optimize Energy Performance\u003c/a\u003e\u003c/strong\u003e. The preliminary energy analysis required for this credit encourages project teams to focus on load reductions before analyzing system efficiencies. Using “simple box” energy modeling at an early stage, even before determining building form, gives a project team energy end-use benchmarks that directly inform design decisions during an iterative process, significantly improving energy performance and reducing operating costs. \n\n\u003cstrong\u003e\u003ca href=\"/node/2612594\" target=\"_blank\"\u003eEQ Prerequisite Minimum Indoor Air Quality Performance\u003c/a\u003e\u003c/strong\u003e. The preliminary energy analysis requires project teams to calculate basic energy end use distribution in the earliest design stages. By doing so, teams can compare the relative energy demands of different ventilation strategies while meeting minimum ventilation requirements.\n \n\u003cstrong\u003e\u003ca href=\"/node/2614615\" target=\"_blank\"\u003eEQ Credit Enhanced Indoor Air Quality Strategies\u003c/a\u003e\u003c/strong\u003e. The preliminary energy-related systems analysis requires project teams to calculate basic energy end use distribution in the earliest design stages. By doing so, teams can compare the relative energy demands of different ventilation strategies, including filtration, exhaust, demand control ventilation, and natural ventilation.\n\n\u003cstrong\u003e\u003ca href=\"/node/2612656\" target=\"_blank\"\u003eEQ Credit Thermal Comfort\u003c/a\u003e\u003c/strong\u003e. Adjusting thermal comfort ranges can dramatically affect energy consumption. The preliminary energy-related systems analysis allows project teams to study the relative energy demands of adjustments to thermal comfort in the earliest design stages. Thermal comfort depends on many interrelated issues covered by a preliminary energy-related systems analysis, such as ventilation, internal loads from lighting and occupants, daylighting strategies, and external loads associated with envelope performance. Early modeling allows project teams to iteratively adjust and evaluate the associated parameters before schematic design. \n\n\u003cstrong\u003e\u003ca href=\"/node/2614118\" target=\"_blank\"\u003eEQ Credit Daylight\u003c/a\u003e\u003c/strong\u003e. Effective daylighting, including appropriate levels of natural light with controls that reduce electric lighting, can dramatically affect energy consumption. The preliminary energy analysis allows project teams to compare daylighting design strategies, particularly balancing total glazing area with its effect on thermal performance and human comfort. \n\n\u003cstrong\u003e\u003ca href=\"/node/2614128\" target=\"_blank\"\u003eEQ Credit Quality Views\u003c/a\u003e\u003c/strong\u003e. The preliminary energy-related systems analysis helps project teams give occupants exterior views while balancing total glazing area with its effect on thermal performance and comfort. \n\n"],"required":["Not Required"],"rpc":["0"],"short_id":["IP102"],"sort_id":[100],"step_by_step_guidance":["\u003ch3\u003eDiscovery Steps\u003c/h3\u003e\n\n\u003ch5\u003eStep 1. Become familiar with integrative process\u003c/h5\u003e\nReview the Integrative Process (IP) ANSI Consensus National Standard Guide© 2.0 for Design and Construction of Sustainable Buildings and Communities, which provides step-by-step guidance and a methodology for improving building design, construction, and operations through a replicable, integrative process. Although this standard encourages project teams to engage in a comprehensive integrative process, the credit requirements address only the discovery phase, whose steps are similar to those described in the ANSI guide for engaging energy and water-related systems. \n\n\u003ch5\u003eStep 2. Conduct preliminary energy research and analysis (in concert with Step 3)\u003c/h5\u003e\nComplete energy-related research and analysis to support effective and informed discussions about potential integrative design opportunities (see \u003ca sid=\"recommended_prelim_data\" class=\"linknavCol\" href=\"#\"\u003e\u003cem\u003eFurther Explanation, Recommended Preliminary Data Collection\u003c/em\u003e\u003c/a\u003e).\n\u003cul\u003e\n\u003cli\u003eCollect information about the local climate, site conditions, energy sources, transportation options, and potential building features.\u003c/li\u003e \n\u003cli\u003eUse the U.S. Environmental Protection Agency’s Target Finder tool or other data sources to benchmark energy performance for the project’s type, scope, occupancy, and location.\u003c/li\u003e\n\u003cli\u003eDevelop a “simple box” energy model (assuming a simplified building form) to generate a basic distribution of energy uses and identify dominant energy loads.\u003c/li\u003e\u003cli\u003e \n\u003c/li\u003e\u003cli\u003eUse this conceptual energy model to analyze design alternatives for potential load reduction strategies (see \u003ca sid=\"recommended_prelim_energy\" class=\"linknavCol\" href=\"#\"\u003e\u003cem\u003eFurther Explanation, Recommended Preliminary Energy Analysis\u003c/em\u003e\u003c/a\u003e and \u003ca sid=\"examples\" class=\"linknavCol\" href=\"#\"\u003e\u003cem\u003eExample 1\u003c/em\u003e\u003c/a\u003e).\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch5\u003eStep 3. Conduct preliminary water research and analysis (in concert with Step 2)\u003c/h5\u003e\nComplete water-related research and analysis to support effective and informed discussions about potential integrative design opportunities. \n\u003cul\u003e\n\u003cli\u003eCollect information about waste treatment infrastructure, water sources, and potential building features (see \u003ca sid=\"recommended_prelim_data\" class=\"linknavCol\" href=\"#\"\u003e\u003cem\u003eFurther Explanation, Recommended Preliminary Data Collection\u003c/em\u003e\u003c/a\u003e).\u003c/li\u003e\n\u003cli\u003eAssess expected water demand for indoor, outdoor, and process water using the methodologies for \u003ca href=\"/node/1734960?return=/credits/new-construction/v4/water-efficiency\" target=\"_blank\"\u003eWE Prerequisite Indoor Water Use Reduction\u003c/a\u003e, \u003ca href=\"/node/2611372?return=/credits/new-construction/v4/water-efficiency\" target=\"_blank\"\u003eWE Prerequisite Outdoor Water Use Reduction\u003c/a\u003e, and \u003ca href=\"/node/2611780?return=/credits/new-construction/v4/water-efficiency\" target=\"_blank\"\u003eWE Credit Cooling Tower Water Use\u003c/a\u003e.\u003c/li\u003e\n\u003cli\u003eGather data to quantify the project’s potential nonpotable supply sources, such as captured rainwater, graywater from flow fixtures, or condensate from HVAC cooling equipment.\u003c/li\u003e\n\u003cli\u003eConduct a preliminary water budget analysis to quantify how fixture and equipment selection and nonpotable supply sources may offset potable water use for the water demands.\u003c/li\u003e \n\u003c/ul\u003e\n\u003ch5\u003eStep 4. Convene goal-setting workshop\u003c/h5\u003e\nEngage the project owner in a primary project team workshop to determine the project goals, including budget, schedule, functional programmatic requirements, scope, quality, performance, and occupants’ expectations. Understanding the owner’s goals promotes creative problem solving and encourages interaction. This workshop should accomplish the following:\n\u003cul\u003e\n\u003cli\u003eIntroduce all project team members to the fundamentals of the integrative process.\u003c/li\u003e\n\u003cli\u003eShare initial background research and analysis findings from Steps 2 and 3.\u003c/li\u003e\n\u003cli\u003eElicit the owner’s and stakeholders’ values and aspirations. \u003c/li\u003e\n\u003cli\u003eClarify functional and programmatic goals.\u003c/li\u003e\n\u003cli\u003eEstablish initial principles, benchmarks, metrics, and performance targets.\u003c/li\u003e\n\u003cli\u003eIdentify targeted LEED credits.\u003c/li\u003e \n\u003cli\u003eGenerate potential integrative strategies for achieving performance targets.\u003c/li\u003e\n\u003cli\u003eDetermine the questions that must be answered to support project decisions.\u003c/li\u003e\n\u003cli\u003eIdentify initial responsibilities and deliverables.\u003c/li\u003e\n\u003cli\u003eInitiate documentation of the owner’s project requirements (OPR).\u003c/li\u003e\n\u003c/ul\u003e\nAll principal project team members should be present at the goal-setting workshop.\n\n\u003ch5\u003eStep 5. Evaluate possible energy strategies (in concert with Step 6)\u003c/h5\u003e\nEvaluate the proposed goals and performance targets for feasibility by exploring possible strategies for the project’s energy-related systems. Evaluate strategies against the initial performance targets and targeted LEED credits. It is recommended that project teams engage this initial early research and analysis by evaluating each subsystem described in the ANSI Consensus National Standard Guide© 2.0 for Design and Construction of Sustainable Buildings and Communities.\n\nConduct preliminary comparative energy modeling using the “simple box” energy model (Step 2) before completing schematic design to evaluate energy load reduction strategies (see \u003ca sid=\"recommended_prelim_energy\" class=\"linknavCol\" href=\"#\"\u003e\u003cem\u003eFurther Explanation, Recommended Preliminary Energy Analysis\u003c/em\u003e\u003c/a\u003e and \u003ca sid=\"examples\" class=\"linknavCol\" href=\"#\"\u003e\u003cem\u003eExample 2\u003c/em\u003e\u003c/a\u003e). Aspects to consider include the following:\n\u003cul\u003e\n\u003cli\u003e\u003cem\u003eSite conditions.\u003c/em\u003e Landscape solar shading, exterior lighting, feasibility for natural ventilation, adjacent site conditions.\u003c/li\u003e\n\u003cli\u003e\u003cem\u003eMassing and orientation.\u003c/em\u003e Number of floors, building footprint, configuration, solar orientation.\u003c/li\u003e\n\u003cli\u003e\u003cem\u003eBuilding envelope attributes.\u003c/em\u003e Wall and roof insulation, thermal mass, window size and orientation, exterior shading devices, window performance (U-values, solar heat gain coefficient, visible light transmittance). \u003c/li\u003e\n\u003cli\u003e\u003cem\u003eLighting levels.\u003c/em\u003e Lighting power density, lighting needs in workspaces, reflectance values for ceiling and wall surfaces, high-efficiency lighting fixtures and controls, daylighting.\u003c/li\u003e\n\u003cli\u003e\u003cem\u003eThermal comfort ranges.\u003c/em\u003e Temperature setpoints and thermal comfort parameters.\u003c/li\u003e\n\u003cli\u003e\u003cem\u003ePlug and process loads.\u003c/em\u003e Equipment and purchasing policies, other programmatic solutions, layout options.\u003c/li\u003e\n\u003cli\u003e\u003cem\u003eProgrammatic and operational parameters.\u003c/em\u003e Hours of operation, space allotment per person, shared program spaces, teleworking policies.\u003c/li\u003e\n\u003c/ul\u003e\nConduct such preliminary modeling to assess at least two optional strategies for each of the above seven aspects.\n\n\u003ch5\u003eStep 6. Evaluate possible water strategies (in concert with Step 5)\u003c/h5\u003e\nEvaluate the proposed goals and performance targets for feasibility by exploring possible strategies for the project’s water-related systems. Conduct a preliminary water budget analysis using research on potential water-use reduction strategies (Step 3). Aspects to consider include the following:\n\u003cul\u003e\n\u003cli\u003e\u003cem\u003eIndoor water use demand.\u003c/em\u003e Preliminary baseline and design case water consumption inside the building, based on the building occupants’ use of assumed plumbing fixture flow and flush rates (using the methodology for \u003ca href=\"/node/1734960?return=/credits/new-construction/v4/water-efficiency\" target=\"_blank\"\u003eWE Prerequisite Indoor Water Use Reduction\u003c/a\u003e).\u003c/li\u003e\n\u003cli\u003e\u003cem\u003eOutdoor water use demand.\u003c/em\u003e Preliminary baseline and design case water consumption for landscape irrigation, based on assumed landscape strategies and irrigation systems (using the methodology for \u003ca href=\"/node/2611372?return=/credits/new-construction/v4/water-efficiency\" target=\"_blank\"\u003eWE Prerequisite Outdoor Water Use Reduction\u003c/a\u003e).\u003c/li\u003e\n\u003c/ul\u003e\nGather data (in addition to that for Step 3) to assess and quantify the project’s potential nonpotable supply sources, such as captured rainwater, graywater from flow fixtures, and condensate produced by initially assumed HVAC cooling equipment. \n\nAssess and quantify how potential nonpotable supply sources can be used to offset potable water use for the water demands calculated above. Identify at least one on-site nonpotable water source that could supply a portion of at least two demand components. \n\n\u003ch3\u003eImplementation Step\u003c/h3\u003e\n\n\u003ch5\u003eStep 7. Document how analysis informed design and building form\u003c/h5\u003e\nDocument energy-related research and analysis from the discovery phase.\n\u003cul\u003e\n\u003cli\u003eDocument how the above energy-related analysis informed design and building form decisions in the project’s OPR and basis of design (BOD), including the following, as applicable:\n       \u003cul\u003e\n             \u003cli\u003eBuilding and site program\u003c/li\u003e\n             \u003cli\u003eBuilding form and geometry\u003c/li\u003e \n             \u003cli\u003eBuilding envelope and façade treatments on different orientations\u003c/li\u003e\n             \u003cli\u003eElimination or significant downsizing of building systems (e.g., HVAC, lighting, controls, exterior materials, interior finishes, and functional program elements)\u003c/li\u003e\n\u003cli\u003eOther systems\u003c/li\u003e\n\u003c/ul\u003e\n\u003c/li\u003e\u003cli\u003eProvide narrative explanations of the energy evaluation in the energy analysis section of the Integrative Process worksheet (provided by USGBC) and identify at least two options for each of the seven aspects listed in Step 5.\u003c/li\u003e\n\u003c/ul\u003e\n\nDocument water-related research and analysis from the discovery phase.\n\u003cul\u003e\n\u003cli\u003eDocument how the water-related analysis informed building and site design decisions in the project’s OPR and BOD, including the following, as applicable:\n       \u003cul\u003e\n              \u003cli\u003ePlumbing systems\u003c/li\u003e\n              \u003cli\u003eSewage conveyance and/or on-site treatment systems\u003c/li\u003e\n              \u003cli\u003eRainwater quantity and quality management systems\u003c/li\u003e\n              \u003cli\u003eLandscaping, irrigation, and site elements\u003c/li\u003e\n              \u003cli\u003eRoofing systems and/or building form and geometry\u003c/li\u003e\n              \u003cli\u003eOther systems\u003c/li\u003e\n         \u003c/ul\u003e\u003c/li\u003e\n\u003cli\u003eProvide narrative explanations of the water evaluation in the water analysis section of the Integrative Process worksheet.\u003c/li\u003e \n\u003c/ul\u003e\n\n"],"title":["Integrative process"],"type":["credit_definition"],"updated_date":[1653580321],"version":["v4"]},"sort":[0,10,"Not Required",100,"Integrative process"]},{"_index":"elasticsearch_index_live_usgbc_credits_dev","_id":"entity:node/11962045:und","_score":null,"_source":{"_language":"und","url":["/credits/new-construction-core-and-shell-schools-new-construction-retail-new-construction-data-30"],"all_reference_resources":[11885370],"category":["Integrative process credits"],"category_weight":[10],"credit_options":[11955010],"credit_type":["1"],"ep":[0],"field_related_courses":[12846224,12856101],"image":["/sites/default/files/np-blank_0_2.png"],"innovation_flag":["Not an innovation credit"],"node_id":[11962045],"open_for_comments":[0],"pilot_credit":["0"],"points_from":["1"],"points_to":["1"],"public_access":[0],"published_date":[1542058786],"published_status":[1],"rating_system":["New Construction","Core and Shell","Schools - New Construction","Retail - New Construction","Data centers - New Construction","Warehouse and distribution centers - New Construction","Hospitality - New Construction","Healthcare"],"rating_system_weight":[0,1,2,3,4,5,6,7],"required":["Not Required"],"rpc":["0"],"short_id":["IP102"],"sort_id":[10200],"title":["Integrative Process"],"type":["credit_definition"],"updated_date":[1739912530],"version":["v4.1"]},"sort":[0,10,"Not Required",10200,"Integrative Process"]},{"_index":"elasticsearch_index_live_usgbc_credits_dev","_id":"entity:node/2615490:und","_score":null,"_source":{"_language":"und","url":["/credits/new-construction-retail-new-construction-data-centers-new-construction-hospitality-new-con-0"],"category":["Location \u0026 transportation"],"category_weight":[12],"credit_guide_resources":
